<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小熊猫摘星星</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <div id="fileBanner" class="file-banner hidden">当前为本地文件模式，音乐功能不可用，请通过本地服务器或网页地址访问</div>
  <main class="game-shell">
    <header class="game-top">
      <a href="../">← 游戏合集</a>
      <div class="top-actions">
        <button id="btnMute" class="text-button" type="button">声音：开</button>
        <button id="btnMusicTop" class="text-button" type="button">音乐列表</button>
      </div>
    </header>
    <section class="stage-wrap">
      <canvas id="stage" aria-label="小熊猫摘星星游戏区域"></canvas>
      <div id="home" class="overlay">
        <p class="eyebrow">MOON · STARS · RED PANDA</p>
        <h1>小熊猫摘星星</h1>
        <p>从月面起跳，踩住星星一路向上，落回月面就结算。</p>
        <button id="btnStart" class="primary" type="button">开始游戏</button>
        <div class="home-links">
          <button id="btnHelp" class="text-button" type="button">玩法说明</button>
          <button id="btnMusic" class="text-button" type="button">音乐选择</button>
        </div>
        <div class="settings-row">
          <label>音量 <input id="vol" type="range" min="0" max="100" value="80"></label>
          <label><input id="reduceFx" type="checkbox"> 减少特效</label>
        </div>
      </div>
      <div id="panel" class="overlay hidden">
        <h2 id="panelTitle"></h2>
        <div id="panelBody" class="panel-body"></div>
        <button id="panelClose" class="primary" type="button">关闭</button>
      </div>
    </section>
    <p class="hint">单击画面起跳 · 移动鼠标控制左右 · 踩星星继续向上，落回月面即结算</p>
  </main>
  <script src="midi.js"></script>
  <script src="vendor/WebAudioFontPlayer.js"></script>
  <script src="vendor/piano_FluidR3_GM.js"></script>
  <script src="game.js"></script>
</body>
</html>
